name: Deploy scoring model code to EC2

on:
  push:
    branches:
      - main
    paths:
      - "model_ec2_docker/score_if_else.py"
      - ".github/workflows/deploy-model-code.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: model-code-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  MODEL_FILE: model_ec2_docker/score_if_else.py
  DEPLOY_BUCKET: data.snowflake
  DEPLOY_PREFIX: model-code
  EC2_MODEL_PATH: /home/ec2-user/model_ec2_docker/score_if_else.py

jobs:
  deploy-model-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate model file
        run: |
          set -euo pipefail
          test -f "$MODEL_FILE"
          python -m py_compile "$MODEL_FILE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload model artifact to S3
        run: |
          set -euo pipefail
          RELEASE_URI="s3://$DEPLOY_BUCKET/$DEPLOY_PREFIX/releases/${GITHUB_SHA}/score_if_else.py"
          LATEST_URI="s3://$DEPLOY_BUCKET/$DEPLOY_PREFIX/latest/score_if_else.py"

          aws s3 cp "$MODEL_FILE" "$RELEASE_URI"
          aws s3 cp "$MODEL_FILE" "$LATEST_URI"

          echo "RELEASE_URI=$RELEASE_URI" >> "$GITHUB_ENV"

      - name: Deploy model file to EC2 with SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          TMP_PATH="/tmp/score_if_else.${GITHUB_SHA}.py"

          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "aws s3 cp '${RELEASE_URI}' '${TMP_PATH}'",
              "python3 -m py_compile '${TMP_PATH}'",
              "if [ -f '${EC2_MODEL_PATH}' ]; then cp -p '${EC2_MODEL_PATH}' '${EC2_MODEL_PATH}.bak'; fi",
              "install -m 0644 '${TMP_PATH}' '${EC2_MODEL_PATH}'",
              "rm -f '${TMP_PATH}'",
              "ls -lh '${EC2_MODEL_PATH}'",
              "sha256sum '${EC2_MODEL_PATH}'",
              "echo 'Model code deployment completed successfully'"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command             --region "$AWS_REGION"             --instance-ids "$EC2_INSTANCE_ID"             --document-name "AWS-RunShellScript"             --comment "Deploy score_if_else.py from GitHub commit ${GITHUB_SHA}"             --parameters file://ssm-commands.json             --query "Command.CommandId"             --output text)

          echo "SSM Command ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed             --region "$AWS_REGION"             --command-id "$COMMAND_ID"             --instance-id "$EC2_INSTANCE_ID"
          WAIT_RC=$?
          set -e

          aws ssm get-command-invocation             --region "$AWS_REGION"             --command-id "$COMMAND_ID"             --instance-id "$EC2_INSTANCE_ID"             --query '{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'

          exit "$WAIT_RC"
